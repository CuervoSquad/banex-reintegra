input {
  http {
    host => "0.0.0.0"
    port => 5044
    codec => json
  }
}

filter {
  mutate {
    add_field => { "project" => "banex-reintegra" }
    add_field => { "environment" => "${ENVIRONMENT:development}" }
  }

  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate { add_tag => ["alert"] }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  stdout {
    codec => rubydebug
  }

  file {
    path => "/usr/share/logstash/logs/banex-%{+YYYY-MM-dd}.log"
    codec => json_lines
  }
}
