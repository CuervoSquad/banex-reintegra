version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banex
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker_celery:
    build: ./backend
    command: celery -A workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  worker_rq:
    build: ./backend
    command: python -m workers.rq_worker
    volumes:
      - ./backend:/app
    depends_on:
      - redis

volumes:
  db_data:
